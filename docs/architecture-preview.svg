<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 940" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4B5563" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    .box   { stroke: #6B7280; stroke-width: 1.5; rx: 12; }
    .t     { fill: #1F2937; font-size: 17px; font-weight: 600; text-anchor: middle; }
    .s     { fill: #4B5563; font-size: 13px; text-anchor: middle; }
    .cap   { fill: #6B7280; font-size: 13px; font-style: italic; text-anchor: middle; }
    .lbl   { fill: #374151; font-size: 13.5px; text-anchor: middle; }
    .edge  { fill: none; stroke: #4B5563; stroke-width: 1.7; marker-end: url(#arr); }
    .dashe { stroke-dasharray: 7 5; }
  </style>

  <text x="860" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">commentToFix — high-level architecture</text>

  <!-- ============ user ============ -->
  <circle cx="72" cy="368" r="20" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M 42 432 Q 72 396 102 432 L 102 462 L 42 462 Z" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="72" y="492" class="t">User</text>

  <!-- ============ frontend ============ -->
  <rect x="170" y="330" width="250" height="110" fill="#DBEAFE" class="box" rx="14"/>
  <text x="295" y="368" class="t">Next.js frontend</text>
  <text x="295" y="390" class="s">on Render</text>
  <text x="295" y="412" class="s">demo site · comment UI · previews</text>

  <!-- user <-> frontend -->
  <path d="M 112 358 L 164 358" class="edge"/>
  <path d="M 164 408 L 112 408" class="edge"/>
  <text x="138" y="322" class="lbl">comment +</text>
  <text x="138" y="340" class="lbl">runtime capture</text>
  <text x="138" y="440" class="lbl">status timeline</text>
  <text x="138" y="458" class="lbl">+ review</text>

  <!-- frontend -> API -->
  <path d="M 420 360 C 460 360 460 250 496 235" class="edge"/>
  <text x="440" y="300" class="lbl" transform="rotate(-52 440 300)">/api/*</text>

  <!-- ============ backend container ============ -->
  <rect x="500" y="110" width="850" height="700" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="10 7" rx="24"/>
  <text x="530" y="148" font-size="20" font-weight="700" fill="#374151">FastAPI backend · one service on Render</text>

  <!-- row 1 -->
  <rect x="530" y="185" width="150" height="72" fill="#EDE9FE" class="box"/>
  <text x="605" y="216" class="t">API + auth</text>
  <text x="605" y="238" class="s">pydantic · rate limit</text>

  <rect x="720" y="185" width="180" height="72" fill="#EDE9FE" class="box"/>
  <text x="810" y="216" class="t">Comment Service</text>
  <text x="810" y="238" class="s">append-only rules</text>

  <rect x="940" y="185" width="250" height="72" fill="#EDE9FE" class="box"/>
  <text x="1065" y="212" class="t">Runner</text>
  <text x="1065" y="236" class="s">policy: start / coalesce / interrupt</text>

  <path d="M 680 221 L 714 221" class="edge"/>
  <path d="M 900 221 L 934 221" class="edge"/>

  <!-- runner -> queue -->
  <path d="M 1065 257 L 1065 300" class="edge"/>

  <!-- queue row -->
  <rect x="680" y="306" width="250" height="90" fill="#FEF3C7" class="box"/>
  <text x="805" y="338" class="t">AgentTaskQueue</text>
  <text x="805" y="360" class="s">task lifecycle: claim / lease</text>
  <text x="805" y="378" class="s">retry / DLQ / janitor</text>

  <rect x="985" y="316" width="160" height="72" fill="#EDE9FE" class="box"/>
  <text x="1065" y="346" class="t">Agent Worker</text>
  <text x="1065" y="368" class="s">analyze · edit · test</text>

  <rect x="1180" y="316" width="150" height="72" fill="#EDE9FE" class="box"/>
  <text x="1255" y="346" class="t">Task Launcher</text>
  <text x="1255" y="368" class="s">fake-claude ▸ Claude</text>

  <path d="M 930 352 L 979 352" class="edge"/>
  <path d="M 1145 352 L 1174 352" class="edge"/>

  <!-- queue <-> taskrepo -->
  <path d="M 805 396 L 805 452" class="edge"/>
  <path d="M 815 452 L 815 396" class="edge"/>
  <!-- TaskRepo cylinder -->
  <g>
    <path d="M 730 470 L 730 540 A 80 16 0 0 0 890 540 L 890 470" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <ellipse cx="810" cy="470" rx="80" ry="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="810" y="520" class="t">TaskRepo</text>
  </g>
  <text x="810" y="582" class="cap">queue owns task persistence</text>

  <!-- worker -> runner services -->
  <path d="M 1065 388 L 1065 452" class="edge"/>
  <text x="1155" y="425" class="lbl">complete_iteration</text>

  <rect x="965" y="458" width="200" height="64" fill="#EDE9FE" class="box"/>
  <text x="1065" y="485" class="t">Iteration record</text>
  <text x="1065" y="506" class="s">system comments · statuses</text>

  <!-- workflow repo -->
  <path d="M 1065 522 L 1065 556" class="edge"/>
  <g>
    <path d="M 985 578 L 985 668 A 80 16 0 0 0 1145 668 L 1145 578" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <ellipse cx="1065" cy="578" rx="80" ry="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="1065" y="618" class="t">SQLite</text>
    <text x="1065" y="642" class="s">threads · comments</text>
    <text x="1065" y="660" class="s">iterations · tasks</text>
  </g>
  <text x="1065" y="712" class="cap">one file, survives restarts</text>

  <!-- SSE back to frontend -->
  <path d="M 680 340 C 500 340 470 380 426 388" class="edge dashe"/>
  <text x="545" y="370" class="lbl">SSE live updates</text>

  <!-- ============ github (simulated) ============ -->
  <rect x="1430" y="200" width="250" height="96" fill="#DCFCE7" class="box dashe" rx="14"/>
  <text x="1555" y="236" class="t">GitHub</text>
  <text x="1555" y="258" class="s">branch + pull request</text>
  <text x="1555" y="278" class="s">simulated · PRService seam</text>

  <!-- launcher -> github -->
  <path d="M 1330 330 C 1400 320 1420 290 1455 300" class="edge"/>
  <text x="1400" y="352" class="lbl">push change</text>

  <!-- api -> github: merge approved sha -->
  <path d="M 605 185 C 605 80 1555 80 1555 194" class="edge"/>
  <text x="1080" y="72" class="lbl">merge approved sha (role-gated: approvers only)</text>

  <!-- ============ preview (simulated) ============ -->
  <rect x="1430" y="470" width="250" height="104" fill="#DCFCE7" class="box dashe" rx="30"/>
  <text x="1555" y="508" class="t">Preview deployment</text>
  <text x="1555" y="530" class="s">per-sha, served by the app</text>
  <text x="1555" y="550" class="s">simulated · PreviewDeployer seam</text>

  <!-- worker -> preview -->
  <path d="M 1255 388 C 1310 430 1370 470 1424 496" class="edge"/>
  <text x="1330" y="452" class="lbl">deploy preview</text>
  <text x="1330" y="470" class="lbl">each iteration</text>

  <!-- github -> pr diff note -->
  <path d="M 1555 296 L 1555 464" class="edge"/>
  <text x="1640" y="380" class="lbl">PR diff =</text>
  <text x="1640" y="398" class="lbl">base…final</text>

  <!-- preview -> user -->
  <path d="M 1555 574 C 1555 880 300 880 92 500" class="edge"/>
  <text x="820" y="866" class="lbl">interactive preview — comment on any sha to iterate from that version</text>

  <!-- legend -->
  <rect x="530" y="900" width="34" height="20" fill="#DCFCE7" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="7 5" rx="5"/>
  <text x="578" y="915" fill="#374151" font-size="13.5">dashed = simulated in the POC — a real client drops in behind the same interface</text>
</svg>
